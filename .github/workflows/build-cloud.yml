name: Build cloud image

on:
  push:
    branches: [main]
    paths: ['cloud/**', 'iso/config/includes.chroot/**', '.github/workflows/build-cloud.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/skullos-cloud:latest
      - name: Smoke test (desktop comes up on :6080)
        run: |
          docker run -d --name s -e VNC_PASSWORD=testpass1 -p 6080:6080 ghcr.io/${{ github.repository_owner }}/skullos-cloud:latest
          for i in $(seq 1 30); do curl -sf localhost:6080/vnc.html >/dev/null && { echo OK; docker exec s claude --version; exit 0; }; sleep 3; done
          docker logs s; exit 1
